# Ережелердің қазақша мәтіндері. {…} толтырғыштары ағылшын нұсқасымен сәйкес болуы керек (тест тексереді).
# PowerShell командалары аударылмайды — олар барлық тілдер үшін бірдей.

AD-USR-INACTIVE:
  name: "Белсенді емес қосулы тіркелгі"
  title: "Қосулы тіркелгі {inactive_days}+ күн белсенді емес"
  description: >-
    Тіркелгі қосулы, бірақ {days_inactive} күн бойы аутентификациядан өтпеген. Ұйықтап жатқан
    тіркелгілер — шабуылдаушылардың сүйікті нысанасы: оларды пайдалануды ешкім байқамайды.
  recommendation: >-
    Тіркелгі әлі қажет пе, басшыдан немесе кадр бөлімінен нақтылаңыз; оны өшіріп, карантиндік
    OU-ға көшіріңіз және сақтау мерзімі өткен соң жойыңыз.

AD-USR-PNE:
  name: "Мерзімсіз құпиясөз"
  title: "Құпиясөздің қолданылу мерзімі шектелмеген"
  description: >-
    userAccountControl ішінде DONT_EXPIRE_PASSWD (0x10000) жалаушасы орнатылған: құпиясөз
    ауыстыру саясатына бағынбайды, ал ағып кеткен тіркелгі деректері мерзімсіз жарамды болып қалады.
  recommendation: >-
    Жалаушаны алып тастаңыз, сонда тіркелгі домендік немесе егжей-тегжейлі (fine-grained)
    құпиясөз саясатына бағынады.

AD-USR-PWD-OLD:
  name: "Ескірген құпиясөз"
  title: "Құпиясөз {pwd_max_age_days}+ күн ауыстырылмаған"
  description: >-
    pwdLastSet бойынша құпиясөз соңғы рет {pwd_age_days} күн бұрын ауыстырылған. Ескі
    құпиясөздер жиі қайта қолданылады, ағып кетеді немесе офлайн режимде бұзылады.
  recommendation: >-
    Келесі кіру кезінде құпиясөзді ауыстыруды талап етіңіз және ротация неге жасалмағанын
    анықтаңыз.

AD-USR-LOCKED:
  name: "Бұғатталған"
  title: "Тіркелгі бұғатталған"
  description: >-
    msDS-User-Account-Control-Computed ішінде LOCKOUT (0x10) орнатылған: қате құпиясөз бірнеше
    рет енгізілген. Бұл ұмытылған құпиясөз — немесе жүріп жатқан шабуыл болуы мүмкін.
  recommendation: >-
    Бұғатты шешпес бұрын 4740/4625/4771 оқиғаларын салыстырып, көзін табыңыз.

AD-USR-PWD-EXPIRED:
  name: "Құпиясөз мерзімі өткен"
  title: "Құпиясөз мерзімі өткен, тіркелгі қосулы"
  description: >-
    msDS-User-Account-Control-Computed ішінде PASSWORD_EXPIRED (0x800000) орнатылған. Иесі
    құпиясөзді жаңарту үшін кірмеген — әдетте бұл тіркелгі енді пайдаланылмайтынын білдіреді.
  recommendation: >-
    Тіркелгінің әлі қажет екенін тексеріңіз; әйтпесе оны өшіріңіз.

AD-USR-EXPIRED:
  name: "Мерзімі өткен, бірақ қосулы"
  title: "Тіркелгі мерзімі өткен, бірақ өшірілмеген"
  description: >-
    accountExpires мерзімі {expired_days} күн бұрын өткен, бірақ тіркелгі әлі қосулы. Мерзім жиі
    үнсіз ұзартылады; өшіру ниетті айқын етеді.
  recommendation: >-
    Тіркелгіні өшіріңіз (немесе шартты және мерзімді ресми түрде ұзартыңыз).

AD-SVC-KERBEROAST:
  name: "Kerberoasting (SPN)"
  title: "Kerberoasting-ке осал — пайдаланушы тіркелгісінде SPN"
  description: >-
    servicePrincipalName орнатылған ({spn}). Кез келген домен пайдаланушысы ол үшін TGS билетін
    сұрап, тіркелгінің өзіне тимей-ақ қызмет құпиясөзін офлайн бұза алады.
  recommendation: >-
    gMSA-ға көшіңіз (автоматты ауыстырылатын 120 таңбалы құпиясөз) немесе 25+ таңбалы кездейсоқ
    құпиясөз орнатып, тек AES шифрлауына рұқсат етіңіз.

AD-SVC-INTERACTIVE:
  name: "Интерактивті кіруге рұқсат"
  title: "Интерактивті кіруге рұқсат етілген"
  description: >-
    {interactive_reason} Қызметтік тіркелгі интерактивті немесе RDP арқылы кіре алса, ұрланған
    қызмет құпиясөзі толыққанды жұмыс үстелі сеансына айналады.
  recommendation: >-
    Кіруге болатын жұмыс станцияларын шектеңіз және GPO арқылы интерактивті кіру мен RDP-ге тыйым
    салыңыз («Жергілікті кіруге тыйым салу», «Қашықтағы жұмыс үстелі қызметтері арқылы кіруге
    тыйым салу»).

AD-SVC-PRIV:
  name: "Жоғарылатылған құқықтар"
  title: "Жоғарылатылған құқықтар — {target_group} тобының мүшесі"
  description: >-
    Қызметтік тіркелгі іс жүзінде {target_group} сыни тобына кіреді ({path_text}). Қызмет
    бұзылса, шабуылдаушы осы құқықтарды алады.
  recommendation: >-
    Тіркелгіні артықшылықты топтар тізбегінен шығарып, қызметке шын мәнінде қажет құқықтарды
    ғана беріңіз.

AD-SVC-PNE:
  name: "Мерзімсіз құпиясөз"
  title: "Қызметтік тіркелгінің құпиясөзі ескірмейді"
  description: >-
    DONT_EXPIRE_PASSWD (0x10000) орнатылған. Ешқашан ауыстырылмайтын қызмет құпиясөздері —
    шабуылдаушылар жылдар бойы пайдаланатын классикалық ұзақ мерзімді тіркелгі деректері.
  recommendation: >-
    Автоматты ауыстыру үшін gMSA-ға көшіңіз немесе тіркелгіні ротация тәртібі құжатталған
    егжей-тегжейлі саясатқа бағындырыңыз.

AD-SVC-PWD-OLD:
  name: "Құпиясөз ауыстырылмаған"
  title: "Қызмет құпиясөзі {pwd_age_days} күн ауыстырылмаған"
  description: >-
    pwdLastSet бойынша құпиясөз {pwd_age_days} күн ауыстырылмаған (шегі — {svc_pwd_max_age_days}).
    Бұрынғы әкімшілер мен мердігерлер оны әлі білуі мүмкін.
  recommendation: >-
    Құпиясөзді ауыстырыңыз (қызмет иесімен келісіп) немесе gMSA-ға көшіңіз.

AD-SVC-NO-OWNER:
  name: "Иесі жоқ"
  title: "Иесі тағайындалмаған"
  description: >-
    managedBy де, manager да орнатылмаған — бұл тіркелгінің құқықтарына, құпиясөзін ауыстыруға
    және пайдаланудан шығаруға ешкім жауап бермейді.
  recommendation: >-
    Иесін тағайындап, тіркелгі қандай бизнес-қызметке арналғанын тіркеңіз.

AD-SVC-UNUSED:
  name: "Пайдаланылмайтын қызметтік тіркелгі"
  title: "Қызметтік тіркелгі пайдаланылмайды ({days_inactive} күн)"
  description: >-
    lastLogonTimestamp бойынша {days_inactive} күн аутентификация болмаған. Иесіз қалған
    қызметтік тіркелгілер қызмет жойылғаннан кейін де құқықтары мен құпиясөздерін ұзақ сақтайды.
  recommendation: >-
    Иесімен келісіп, өшіріңіз және сақтау мерзімі өткен соң жойыңыз.

AD-PRIV-NESTED:
  name: "Кірістірілген топтар арқылы эскалация"
  title: "Кірістірілген топтар арқылы артық құқықтар → {target_group}"
  description: >-
    Тіркелгі ешбір әкімшілік топқа тікелей кірмейді, бірақ кірістіру арқылы {target_group}
    құқықтарын иеленеді: {path_text}. Бұл байқалмайтын эскалация ADUC-тегі «Топтар мүшесі»
    қойындысында көрінбейді.
  recommendation: >-
    Тізбекті үзіңіз: тіркелгіні {via_group} тобынан шығарыңыз немесе {escalation_group} тобын
    {target_group} тобынан алып тастаңыз. Әкімшілік құқықтарды тек арнайы, тексерілетін әкімші
    топтары арқылы беріңіз.

AD-PRIV-HIDDEN-PGID:
  name: "Жасырын әкімші (primaryGroupID)"
  title: "primaryGroupID арқылы {target_group} тобына жасырын мүшелік"
  description: >-
    primaryGroupID = {pgid} бұл тіркелгіні іс жүзінде {target_group} мүшесі етеді, бірақ ол
    топтың member атрибутында КӨРІНБЕЙДІ — көптеген құралдар мен әкімшілер оны байқамайды.
  recommendation: >-
    primaryGroupID мәнін 513 (Domain Users) етіп қайтарыңыз және оны кім, не үшін өзгерткенін
    анықтаңыз.

AD-PRIV-DISABLED:
  name: "Өшірілген, бірақ артықшылықты"
  title: "Өшірілген тіркелгі әлі де {target_group} тобында"
  description: >-
    Тіркелгі өшірілген (ACCOUNTDISABLE 0x2), бірақ іс жүзінде {target_group} мүшесі болып қалады.
    Оны қайта қосу — қателесіп немесе шабуылдаушы арқылы — әкімші құқықтарын бірден қалпына
    келтіреді.
  recommendation: >-
    Өшірілген тіркелгілерден артықшылықты топтардағы барлық мүшелікті алып тастаңыз.

AD-PRIV-INACTIVE:
  name: "Белсенді емес артықшылықты тіркелгі"
  title: "Артықшылықты тіркелгі {days_inactive} күн белсенді емес"
  description: >-
    {target_group} тобының қосулы мүшесі {days_inactive} күн аутентификациядан өтпеген.
    Пайдаланылмайтын әкімші тіркелгілері — ешкім бақыламайтын құнды нысаналар.
  recommendation: >-
    Тіркелгіні өшіріп, артықшылықты топтардағы мүшелігін алып тастаңыз.

AD-PRIV-MULTI:
  name: "Бірнеше әкімші тобы"
  title: "{group_count} әкімшілік топтың мүшесі"
  description: >-
    Тікелей мүше болған топтар: {group_list}. Бір тіркелгіде бірнеше әкімшілік рөлді біріктіру
    ең аз артықшылық және деңгейлерге бөлу (tiering) қағидаттарын бұзады.
  recommendation: >-
    Әр әкімшілік тіркелгіге бір рөл қалдырыңыз; міндеттерді деңгейлер бойынша бөлек
    тіркелгілерге бөліңіз.

AD-PRIV-DA-OVERSIZED:
  name: "Domain Admins тым үлкен"
  title: "Domain Admins тобында {member_count} нақты мүше бар"
  description: >-
    Кірістіру мен primaryGroupID ескерілгенде, {member_count} тіркелгі іс жүзінде Domain Admins
    тобына кіреді (шегі — {da_max_members}). Әр артық мүше бүкіл орманның шабуыл бетін ұлғайтады.
  recommendation: >-
    Domain Admins тобын Tier-0 деңгейіндегі шағын арнайы тіркелгілер жиынына дейін қысқартыңыз;
    күнделікті әкімшілендіру үшін шектеулі өкілетті топтарды пайдаланыңыз.

AD-PRIV-ADMINCOUNT-ORPHAN:
  name: "Иесіз adminCount"
  title: "Иесіз adminCount=1 (AdminSDHolder)"
  description: >-
    adminCount = 1, бірақ тіркелгі енді ешбір қорғалған топқа кірмейді. Ол мұрагерлігі өшірілген
    AdminSDHolder ACL-ін сақтайды — бұрынғы әкімшінің белгісі және кең тараған бекіну әдісі.
  recommendation: >-
    adminCount мәнін тазалап, объектіде ACL мұрагерлігін қайта қосыңыз.

AD-POL-MIN-LENGTH:
  name: "Қысқа ең аз ұзындық"
  title: "Құпиясөздің ең аз ұзындығы — {current_value}"
  description: >-
    {policy_label} {current_value} таңбалы құпиясөздерге рұқсат береді (базалық деңгей —
    {min_pwd_length}+). Қысқа құпиясөздер тез табылады және офлайн бұзылады.
  recommendation: >-
    Ең аз ұзындықты кемінде {min_pwd_length} дейін арттырыңыз; құпия фразаларды таңдаңыз.

AD-POL-NO-LOCKOUT:
  name: "Тіркелгі бұғатталмайды"
  title: "Тіркелгіні бұғаттау өшірілген (lockoutThreshold = 0)"
  description: >-
    {policy_label} тіркелгілерді ешқашан бұғаттамайды, сондықтан шабуылдаушы құпиясөздерді
    шектеусіз таңдай алады — password spraying пен күшпен теру ештеңемен тежелмейді.
  recommendation: >-
    Бұғаттау шегін орнатыңыз (мысалы, 10 әрекет / 15 минут) және 4740 оқиғаларын бақылаңыз.

AD-POL-NO-COMPLEXITY:
  name: "Күрделілік талабы жоқ"
  title: "Құпиясөз күрделілігі талабы өшірілген"
  description: >-
    {policy_label} құпиясөздің күрделілігін талап етпейді (pwdProperties ішіндегі 0x1 биті өшірулі).
  recommendation: >-
    Күрделілік талабын қосыңыз немесе тыйым салынған құпиясөздер тізімімен бірге ұзын құпия
    фразаларды талап етіңіз.

AD-POL-REVERSIBLE:
  name: "Қайтымды шифрлау (саясат)"
  title: "Саясатта құпиясөздерді қайтымды шифрлау қосылған"
  description: >-
    {policy_label} құпиясөздерді қайтымды шифрлаумен сақтайды — каталог дерекқорын оқи алатын
    кез келген адам үшін бұл ашық мәтінмен бірдей.
  recommendation: >-
    Қайтымды шифрлауды өшіріп, зардап шеккен пайдаланушыларды құпиясөзін ауыстыруға міндеттеңіз.

AD-PWD-NOTREQD:
  name: "Құпиясөз талап етілмейді"
  title: "Құпиясөз талап етілмейді (PASSWD_NOTREQD)"
  description: >-
    userAccountControl ішінде PASSWD_NOTREQD (0x20) орнатылған: домен саясатына қарамастан
    тіркелгінің құпиясөзі бос болуы мүмкін.
  recommendation: >-
    Жалаушаны алып тастап, саясатқа сай құпиясөз орнатылғанына көз жеткізіңіз.

AD-PWD-REVERSIBLE:
  name: "Қайтымды шифрлау"
  title: "Тіркелгі үшін қайтымды шифрлау қосылған"
  description: >-
    userAccountControl ішінде ENCRYPTED_TEXT_PWD_ALLOWED (0x80) орнатылған: келесі орнатылған
    құпиясөз қайтымды түрде сақталады және оны каталогтан алуға болады.
  recommendation: >-
    Жалаушаны алып тастаңыз, содан кейін құпиясөзді ауыстыруды талап етіңіз.

AD-PWD-ASREP:
  name: "AS-REP roasting"
  title: "AS-REP roasting-ке осал (алдын ала аутентификация өшірілген)"
  description: >-
    DONT_REQ_PREAUTH (0x400000) орнатылған: кез келген адам бұл тіркелгі үшін AS-REP сұрап, оның
    құпиясөзін офлайн бұза алады — ешқандай тіркелгі деректері қажет емес.
  recommendation: >-
    Kerberos алдын ала аутентификациясын қайта қосыңыз.

