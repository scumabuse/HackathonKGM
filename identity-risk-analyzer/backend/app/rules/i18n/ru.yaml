# Русские тексты правил. Плейсхолдеры {…} должны совпадать с английскими (проверяется тестом).
# PowerShell-команды не переводятся — они одинаковы для всех языков.

AD-USR-INACTIVE:
  name: "Неактивная включённая учётка"
  title: "Включённая учётная запись неактивна {inactive_days}+ дней"
  description: >-
    Учётная запись включена, но не проходила аутентификацию {days_inactive} дн. Спящие учётные
    записи — излюбленная цель атакующих: их компрометацию никто не замечает.
  recommendation: >-
    Уточните у руководителя или отдела кадров, нужна ли учётная запись; отключите её, перенесите
    в карантинное OU и удалите по истечении срока хранения.

AD-USR-PNE:
  name: "Пароль без срока действия"
  title: "Срок действия пароля не ограничен"
  description: >-
    В userAccountControl установлен флаг DONT_EXPIRE_PASSWD (0x10000): пароль не подчиняется
    политике смены, и утёкшие учётные данные остаются действительными бессрочно.
  recommendation: >-
    Снимите флаг, чтобы учётная запись подчинялась доменной или детальной (fine-grained)
    политике паролей.

AD-USR-PWD-OLD:
  name: "Устаревший пароль"
  title: "Пароль не менялся {pwd_max_age_days}+ дней"
  description: >-
    По pwdLastSet пароль последний раз менялся {pwd_age_days} дн. назад. Старые пароли чаще
    используются повторно, утекают или подбираются офлайн.
  recommendation: >-
    Потребуйте смену пароля при следующем входе и выясните, почему ротация не выполнялась.

AD-USR-LOCKED:
  name: "Заблокирована"
  title: "Учётная запись заблокирована"
  description: >-
    В msDS-User-Account-Control-Computed установлен LOCKOUT (0x10): многократно вводился
    неверный пароль. Это может быть забытый пароль — или идущая атака.
  recommendation: >-
    Перед разблокировкой сопоставьте события 4740/4625/4771 и найдите источник.

AD-USR-PWD-EXPIRED:
  name: "Пароль истёк"
  title: "Пароль истёк, учётная запись включена"
  description: >-
    В msDS-User-Account-Control-Computed установлен PASSWORD_EXPIRED (0x800000). Владелец не
    входил, чтобы сменить пароль, — обычно это значит, что учётная запись больше не используется.
  recommendation: >-
    Убедитесь, что учётная запись ещё нужна; иначе отключите её.

AD-USR-EXPIRED:
  name: "Истекла, но включена"
  title: "Срок учётной записи истёк, но она не отключена"
  description: >-
    Срок accountExpires истёк {expired_days} дн. назад, но учётная запись по-прежнему включена.
    Срок часто молча продлевают; отключение делает намерение явным.
  recommendation: >-
    Отключите учётную запись (или официально продлите договор и срок действия).

AD-SVC-KERBEROAST:
  name: "Kerberoasting (SPN)"
  title: "Уязвима к Kerberoasting — SPN на учётной записи пользователя"
  description: >-
    Задан servicePrincipalName ({spn}). Любой пользователь домена может запросить для него
    TGS-билет и подобрать пароль сервиса офлайн, не касаясь самой учётной записи.
  recommendation: >-
    Перейдите на gMSA (120-символьный пароль с автоматической сменой) или задайте случайный
    пароль длиной 25+ символов и разрешите только шифрование AES.

AD-SVC-INTERACTIVE:
  name: "Разрешён интерактивный вход"
  title: "Разрешён интерактивный вход"
  description: >-
    {interactive_reason} Если сервисная учётная запись может входить интерактивно или по RDP,
    украденный пароль сервиса превращается в полноценный сеанс рабочего стола.
  recommendation: >-
    Ограничьте список рабочих станций для входа и запретите интерактивный вход и RDP через GPO
    («Запретить локальный вход», «Запретить вход через службы удалённых рабочих столов»).

AD-SVC-PRIV:
  name: "Повышенные права"
  title: "Повышенные права — член группы {target_group}"
  description: >-
    Сервисная учётная запись фактически входит в критическую группу {target_group}
    ({path_text}). Компрометация сервиса даёт атакующему эти права.
  recommendation: >-
    Исключите учётную запись из цепочки привилегированных групп и делегируйте только те права,
    которые действительно нужны сервису.

AD-SVC-PNE:
  name: "Пароль без срока действия"
  title: "Пароль сервисной учётной записи не истекает"
  description: >-
    Установлен DONT_EXPIRE_PASSWD (0x10000). Никогда не меняющиеся пароли сервисов —
    классические долгоживущие учётные данные, которыми атакующие пользуются годами.
  recommendation: >-
    Перейдите на gMSA для автоматической смены или подчините учётную запись детальной политике
    с задокументированной процедурой ротации.

AD-SVC-PWD-OLD:
  name: "Пароль не менялся"
  title: "Пароль сервиса не менялся {pwd_age_days} дн."
  description: >-
    По pwdLastSet пароль не менялся {pwd_age_days} дн. (порог — {svc_pwd_max_age_days}).
    Бывшие администраторы и подрядчики всё ещё могут его знать.
  recommendation: >-
    Смените пароль (согласовав с владельцем сервиса) или перейдите на gMSA.

AD-SVC-NO-OWNER:
  name: "Нет владельца"
  title: "Владелец не назначен"
  description: >-
    Не заданы ни managedBy, ни manager — никто не отвечает за права этой учётной записи, смену
    пароля и вывод из эксплуатации.
  recommendation: >-
    Назначьте владельца и зафиксируйте, какой бизнес-сервис обслуживает учётная запись.

AD-SVC-UNUSED:
  name: "Неиспользуемая сервисная учётка"
  title: "Сервисная учётная запись не используется ({days_inactive} дн.)"
  description: >-
    По lastLogonTimestamp аутентификаций не было {days_inactive} дн. Брошенные сервисные учётные
    записи сохраняют права и пароли ещё долго после исчезновения сервиса.
  recommendation: >-
    Согласуйте с владельцем, отключите и удалите по истечении срока хранения.

AD-PRIV-NESTED:
  name: "Эскалация через вложенные группы"
  title: "Избыточные права через вложенные группы → {target_group}"
  description: >-
    Учётная запись не входит напрямую ни в одну административную группу, но наследует
    {target_group} через вложенность: {path_text}. Эта неочевидная эскалация не видна на вкладке
    «Член групп» в ADUC.
  recommendation: >-
    Разорвите цепочку: исключите учётную запись из {via_group} или уберите вложение
    {escalation_group} в {target_group}. Выдавайте административные права только через
    выделенные, проверяемые группы администраторов.

AD-PRIV-HIDDEN-PGID:
  name: "Скрытый админ (primaryGroupID)"
  title: "Скрытое членство в {target_group} через primaryGroupID"
  description: >-
    primaryGroupID = {pgid} делает учётную запись фактическим членом {target_group}, но она НЕ
    отображается в атрибуте member группы — большинство инструментов и администраторов её не видят.
  recommendation: >-
    Верните primaryGroupID = 513 (Domain Users) и выясните, кто и зачем его изменил.

AD-PRIV-DISABLED:
  name: "Отключена, но с привилегиями"
  title: "Отключённая учётная запись всё ещё в {target_group}"
  description: >-
    Учётная запись отключена (ACCOUNTDISABLE 0x2), но остаётся фактическим членом {target_group}.
    Повторное включение — по ошибке или атакующим — мгновенно возвращает права администратора.
  recommendation: >-
    Удалите все членства в привилегированных группах у отключённых учётных записей.

AD-PRIV-INACTIVE:
  name: "Неактивная привилегированная учётка"
  title: "Привилегированная учётная запись неактивна {days_inactive} дн."
  description: >-
    Включённый член группы {target_group} не проходил аутентификацию {days_inactive} дн.
    Неиспользуемые административные учётные записи — ценные цели, за которыми никто не следит.
  recommendation: >-
    Отключите учётную запись и удалите её членство в привилегированных группах.

AD-PRIV-MULTI:
  name: "Несколько админ-групп"
  title: "Член административных групп: {group_count}"
  description: >-
    Прямой член групп: {group_list}. Совмещение нескольких административных ролей в одной
    учётной записи нарушает принципы минимальных привилегий и разделения на уровни (tiering).
  recommendation: >-
    Оставьте одну роль на административную учётную запись; разделите обязанности между
    отдельными учётными записями по уровням.

AD-PRIV-DA-OVERSIZED:
  name: "Раздутая Domain Admins"
  title: "Фактических членов в Domain Admins: {member_count}"
  description: >-
    Фактических членов Domain Admins с учётом вложенности и primaryGroupID: {member_count}
    (порог — {da_max_members}). Каждый лишний член увеличивает поверхность атаки всего леса.
  recommendation: >-
    Сократите Domain Admins до небольшого набора выделенных учётных записей Tier-0; для
    повседневного администрирования используйте делегированные группы с ограниченной областью.

AD-PRIV-ADMINCOUNT-ORPHAN:
  name: "Осиротевший adminCount"
  title: "Осиротевший adminCount=1 (AdminSDHolder)"
  description: >-
    adminCount = 1, но учётная запись больше не входит ни в одну защищённую группу. Она сохраняет
    ACL от AdminSDHolder с отключённым наследованием — признак бывшего администратора и
    распространённый приём закрепления.
  recommendation: >-
    Очистите adminCount и снова включите наследование ACL на объекте.

AD-POL-MIN-LENGTH:
  name: "Короткая минимальная длина"
  title: "Минимальная длина пароля — {current_value}"
  description: >-
    {policy_label} допускает пароли длиной {current_value} симв. (базовый уровень —
    {min_pwd_length}+). Короткие пароли быстро подбираются и взламываются офлайн.
  recommendation: >-
    Увеличьте минимальную длину как минимум до {min_pwd_length}; отдавайте предпочтение
    парольным фразам.

AD-POL-NO-LOCKOUT:
  name: "Нет блокировки учётных записей"
  title: "Блокировка учётных записей отключена (lockoutThreshold = 0)"
  description: >-
    {policy_label} никогда не блокирует учётные записи, поэтому атакующий может подбирать пароли
    без ограничений — password spraying и перебор ничем не сдерживаются.
  recommendation: >-
    Задайте порог блокировки (например, 10 попыток / 15 минут) и отслеживайте события 4740.

AD-POL-NO-COMPLEXITY:
  name: "Нет требований сложности"
  title: "Требования к сложности пароля отключены"
  description: >-
    {policy_label} не требует сложности паролей (бит 0x1 в pwdProperties сброшен).
  recommendation: >-
    Включите требования сложности или требуйте длинные парольные фразы вместе со списком
    запрещённых паролей.

AD-POL-REVERSIBLE:
  name: "Обратимое шифрование (политика)"
  title: "В политике включено обратимое шифрование паролей"
  description: >-
    {policy_label} хранит пароли с обратимым шифрованием — для любого, кто может прочитать базу
    каталога, это равносильно открытому тексту.
  recommendation: >-
    Отключите обратимое шифрование и потребуйте от затронутых пользователей сменить пароли.

AD-PWD-NOTREQD:
  name: "Пароль не требуется"
  title: "Пароль не требуется (PASSWD_NOTREQD)"
  description: >-
    В userAccountControl установлен PASSWD_NOTREQD (0x20): у учётной записи может быть пустой
    пароль вне зависимости от политики домена.
  recommendation: >-
    Снимите флаг и убедитесь, что задан пароль, соответствующий политике.

AD-PWD-REVERSIBLE:
  name: "Обратимое шифрование"
  title: "Для учётной записи включено обратимое шифрование"
  description: >-
    В userAccountControl установлен ENCRYPTED_TEXT_PWD_ALLOWED (0x80): следующий заданный пароль
    сохранится обратимо, и его можно будет извлечь из каталога.
  recommendation: >-
    Снимите флаг, затем потребуйте смену пароля.

AD-PWD-ASREP:
  name: "AS-REP roasting"
  title: "Уязвима к AS-REP roasting (предаутентификация отключена)"
  description: >-
    Установлен DONT_REQ_PREAUTH (0x400000): кто угодно может запросить AS-REP для этой учётной
    записи и подобрать её пароль офлайн — без каких-либо учётных данных.
  recommendation: >-
    Снова включите предварительную аутентификацию Kerberos.

AD-AUTH-SPRAY:
  name: "Источник password spray"
  title: "Password spray с адреса {name}"
  description: >-
    За {window_minutes} мин. с {name} были неудачные попытки входа в разные учётные записи
    (всего: {target_count}), не более {max_per_account} попыток на каждую — характерный признак
    password spraying.
  recommendation: >-
    Изолируйте и расследуйте узел-источник, смените пароли учётных записей, которые затем успешно
    вошли с него, и включите блокировку учётных записей.

AD-AUTH-BRUTE:
  name: "Цель перебора паролей"
  title: "Перебор паролей — неудачных входов: {failure_count}"
  description: >-
    Неудачных аутентификаций подряд для этой учётной записи: {failure_count} — в период с
    {first_failure} по {last_failure} (источники: {sources}).
  recommendation: >-
    Найдите и заблокируйте источник; смените пароль, если после неудачных попыток был успешный вход.

AD-CMP-INACTIVE:
  name: "Неактивный компьютер"
  title: "Учётная запись компьютера неактивна {days_inactive} дн."
  description: >-
    Компьютер не обновлял lastLogonTimestamp {days_inactive} дн. Устаревшие учётные записи машин
    можно использовать для подключения посторонних узлов или в relay-атаках.
  recommendation: >-
    Отключите, затем удалите по истечении срока хранения.

AD-EXT-SIDHISTORY:
  name: "Заполнен sIDHistory"
  title: "Заполнен атрибут sIDHistory"
  description: >-
    sIDHistory содержит {sid_history}. SID из истории учитываются при проверке доступа — это
    наследие миграций и известный приём закрепления.
  recommendation: >-
    Очистите sIDHistory после завершения миграции.

AD-EXT-UNCONSTRAINED:
  name: "Неограниченное делегирование"
  title: "Неограниченное делегирование Kerberos"
  description: >-
    На объекте, не являющемся контроллером домена, установлен TRUSTED_FOR_DELEGATION (0x80000).
    Каждый аутентифицирующийся на нём пользователь оставляет в памяти пересылаемый TGT — стоит
    вынудить DC подключиться, и домен потерян.
  recommendation: >-
    Перейдите на ограниченное делегирование или делегирование на основе ресурсов (RBCD).

AD-EXT-KRBTGT-OLD:
  name: "Старый пароль krbtgt"
  title: "Пароль krbtgt не менялся {pwd_age_days} дн."
  description: >-
    Ключ krbtgt подписывает каждый билет Kerberos. Он не менялся {pwd_age_days} дн. (порог —
    {krbtgt_max_age_days}); любая прошлая компрометация до сих пор позволяет создавать Golden Ticket.
  recommendation: >-
    Смените пароль krbtgt дважды, дожидаясь репликации и не менее максимального срока жизни
    билета (10 ч) между сменами, — используйте скрипт Microsoft New-KrbtgtKeys.ps1.

AD-EXT-DUP-SPN:
  name: "Дублирующийся SPN"
  title: "Дублирующийся SPN {spn}"
  description: >-
    SPN {spn} зарегистрирован также на {other_holders}. Kerberos не может однозначно выбрать
    ключ: аутентификация ломается или откатывается на NTLM.
  recommendation: >-
    Оставьте SPN только на одной учётной записи.
