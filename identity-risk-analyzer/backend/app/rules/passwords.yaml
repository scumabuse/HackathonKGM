# Passwords & authentication (spec 2.3.4). Evaluated by analyzers/password_analyzer.py.
# HARD RULE: no password or hash is ever read. Only policy attributes, UAC flags and
# Security-log metadata (event id, account, source IP, time) are used.
analyzer: passwords
rules:
  - id: AD-POL-MIN-LENGTH
    name: Short minimum length
    category: Config
    weight: 0.40
    level_hint: High
    applies_to: [domain, policy]
    title: Minimum password length is {current_value}
    description: >-
      {policy_label} allows passwords of {current_value} characters (baseline:
      {min_pwd_length}+). Short passwords fall quickly to guessing and offline cracking.
    recommendation: Raise the minimum length to at least {min_pwd_length}; prefer passphrases.
    remediation_command: "{ps_policy_setter} -MinPasswordLength {min_pwd_length}"
    mitre: [T1110]

  - id: AD-POL-NO-LOCKOUT
    name: No account lockout
    category: Config
    weight: 0.60
    level_hint: Critical
    applies_to: [domain, policy]
    title: No account lockout (lockoutThreshold = 0)
    description: >-
      {policy_label} never locks accounts, so attackers can guess passwords without limit —
      password spraying and brute force go completely unthrottled.
    recommendation: Set a lockout threshold (e.g. 10 attempts / 15 minutes) and monitor 4740 events.
    remediation_command: "{ps_policy_setter} -LockoutThreshold 10 -LockoutDuration 00:15:00 -LockoutObservationWindow 00:15:00"
    mitre: [T1110.001, T1110.003]

  - id: AD-POL-NO-COMPLEXITY
    name: No complexity
    category: Config
    weight: 0.40
    level_hint: High
    applies_to: [domain, policy]
    title: Password complexity disabled
    description: "{policy_label} does not require complexity (pwdProperties bit 0x1 is off)."
    recommendation: Enable complexity or enforce long passphrases plus a banned-password list.
    remediation_command: "{ps_policy_setter} -ComplexityEnabled $true"
    mitre: [T1110]

  - id: AD-POL-REVERSIBLE
    name: Reversible encryption (policy)
    category: Config
    weight: 0.50
    level_hint: High
    applies_to: [domain, policy]
    title: Reversible password encryption enabled in policy
    description: >-
      {policy_label} stores passwords with reversible encryption — equivalent to plaintext for
      anyone who can read the directory database.
    recommendation: Disable reversible encryption and force affected users to change passwords.
    remediation_command: "{ps_policy_setter} -ReversibleEncryptionEnabled $false"
    mitre: [T1003.006]

  - id: AD-PWD-NOTREQD
    name: Password not required
    category: Passwords
    weight: 0.45
    level_hint: High
    applies_to: [user, serviceAccount]
    title: Password not required (PASSWD_NOTREQD)
    description: >-
      userAccountControl has PASSWD_NOTREQD (0x20): the account may have an empty password
      regardless of the domain policy.
    recommendation: Clear the flag and make sure a policy-compliant password is set.
    remediation_command: Set-ADAccountControl -Identity '{sam}' -PasswordNotRequired $false
    mitre: [T1078.002]

  - id: AD-PWD-REVERSIBLE
    name: Reversible encryption
    category: Passwords
    weight: 0.50
    level_hint: High
    applies_to: [user, serviceAccount]
    title: Reversible encryption enabled on account
    description: >-
      userAccountControl has ENCRYPTED_TEXT_PWD_ALLOWED (0x80): the next password set is
      stored reversibly and can be recovered from the directory.
    recommendation: Clear the flag, then force a password change.
    remediation_command: |-
      Set-ADAccountControl -Identity '{sam}' -AllowReversiblePasswordEncryption $false
      Set-ADUser -Identity '{sam}' -ChangePasswordAtLogon $true
    mitre: [T1003.006]

  - id: AD-PWD-ASREP
    name: AS-REP roastable
    category: Passwords
    weight: 0.60
    level_hint: Critical
    applies_to: [user, serviceAccount]
    title: AS-REP roastable (pre-auth disabled)
    description: >-
      DONT_REQ_PREAUTH (0x400000) is set: anyone can request an AS-REP for this account and
      crack its password offline — no credentials needed.
    recommendation: Re-enable Kerberos pre-authentication.
    remediation_command: Set-ADAccountControl -Identity '{sam}' -DoesNotRequirePreAuth $false
    mitre: [T1558.004]

  - id: AD-AUTH-SPRAY
    name: Password spray source
    category: Passwords
    weight: 0.70
    level_hint: Critical
    applies_to: [host]
    title: Password spray from {name}
    description: >-
      {target_count} distinct accounts received failed logons from {name} within
      {window_minutes} minutes, at most {max_per_account} attempts each — the signature of
      password spraying.
    recommendation: >-
      Isolate/investigate the source host, reset passwords of any account that later
      succeeded from it, and enable account lockout.
    remediation_command: |-
      Get-WinEvent -ComputerName '<DC>' -FilterHashtable @{{LogName='Security'; Id=4625,4771}} -MaxEvents 500 |
        Where-Object {{ $_.Message -match '{name}' }}
    mitre: [T1110.003]

  - id: AD-AUTH-BRUTE
    name: Brute-force target
    category: Passwords
    weight: 0.55
    level_hint: High
    applies_to: [user, serviceAccount]
    title: Brute force — {failure_count} failed logons
    description: >-
      {failure_count} consecutive failed authentications against this account between
      {first_failure} and {last_failure} (sources: {sources}).
    recommendation: >-
      Identify and block the source; reset the password if any success followed the failures.
    remediation_command: |-
      Get-WinEvent -ComputerName '<DC>' -FilterHashtable @{{LogName='Security'; Id=4625,4771,4740}} -MaxEvents 500 |
        Where-Object {{ $_.Message -match '{sam}' }}
    mitre: [T1110.001]
