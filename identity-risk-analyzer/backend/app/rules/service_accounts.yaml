# Service accounts (spec 2.3.2). Evaluated by analyzers/service_analyzer.py.
# Detection heuristics (configurable in Settings): SPN on a user object, name prefixes
# svc_/sa_/srv_, a designated OU, or the gMSA object class.
analyzer: service
rules:
  - id: AD-SVC-KERBEROAST
    name: Kerberoastable (SPN)
    category: Service
    weight: 0.40
    level_hint: High
    applies_to: [serviceAccount]
    title: Kerberoastable — SPN on a user account
    description: >-
      servicePrincipalName is set ({spn}). Any domain user can request a TGS ticket for it and
      crack the service password offline without touching the account.
    recommendation: >-
      Migrate to a gMSA (120-char auto-rotated password) or set a 25+ character random
      password and enforce AES-only encryption types.
    remediation_command: |-
      Set-ADUser -Identity '{sam}' -Replace @{{'msDS-SupportedEncryptionTypes'=24}}  # AES128+AES256 only
      # preferred: New-ADServiceAccount -Name 'gmsa-<app>' -DNSHostName 'gmsa-<app>.{domain}' -PrincipalsAllowedToRetrieveManagedPassword '<AppServers>'
    mitre: [T1558.003]

  - id: AD-SVC-INTERACTIVE
    name: Interactive logon allowed
    category: Service
    weight: 0.25
    level_hint: Medium
    applies_to: [serviceAccount]
    title: Interactive logon allowed
    description: >-
      {interactive_reason} A service account that can log on interactively or via RDP turns a
      stolen service password into a full desktop session.
    recommendation: >-
      Restrict logon workstations and deny interactive/RDP logon via GPO
      ("Deny log on locally", "Deny log on through Remote Desktop Services").
    remediation_command: Set-ADUser -Identity '{sam}' -LogonWorkstations '<APP-SERVER01>,<APP-SERVER02>'
    mitre: [T1078.002, T1021.001]

  - id: AD-SVC-PRIV
    name: Elevated rights
    category: Service
    weight: 0.50
    level_hint: High
    applies_to: [serviceAccount]
    title: Elevated rights — member of {target_group}
    description: >-
      The service account is an effective member of the critical group {target_group}
      ({path_text}). Compromise of the service gives the attacker these rights.
    recommendation: >-
      Remove the account from the privileged group chain and grant only the specific
      delegated rights the service actually needs.
    remediation_command: Remove-ADGroupMember -Identity '{via_group}' -Members '{sam}' -Confirm:$false
    mitre: [T1078.002, T1069.002]

  - id: AD-SVC-PNE
    name: Password never expires
    category: Service
    weight: 0.30
    level_hint: Medium
    applies_to: [serviceAccount]
    title: Service account password never expires
    description: >-
      DONT_EXPIRE_PASSWD (0x10000) is set. Service passwords that never rotate are the classic
      long-lived credential attackers reuse for years.
    recommendation: >-
      Migrate to a gMSA for automatic rotation, or put the account under a fine-grained policy
      with a documented rotation procedure.
    remediation_command: |-
      Set-ADUser -Identity '{sam}' -PasswordNeverExpires $false
      # preferred: migrate the service to a gMSA (New-ADServiceAccount)
    mitre: [T1078.002]

  - id: AD-SVC-PWD-OLD
    name: Password unchanged
    category: Service
    weight: 0.35
    level_hint: Medium
    applies_to: [serviceAccount]
    title: Service password unchanged for {pwd_age_days} days
    description: >-
      pwdLastSet shows the password has not changed for {pwd_age_days} days (threshold
      {svc_pwd_max_age_days}). Former admins and vendors may still know it.
    recommendation: Rotate the password (coordinate with the service owner) or migrate to a gMSA.
    remediation_command: |-
      Set-ADAccountPassword -Identity '{sam}' -Reset   # prompts for the new secret; update the service config afterwards
    mitre: [T1078.002]

  - id: AD-SVC-NO-OWNER
    name: No owner
    category: Service
    weight: 0.10
    level_hint: Low
    applies_to: [serviceAccount]
    title: No owner assigned
    description: >-
      Neither managedBy nor manager is set, so nobody is accountable for this account's
      rights, password rotation or decommissioning.
    recommendation: Assign an owner and record the business service it supports.
    remediation_command: Set-ADUser -Identity '{sam}' -Manager '<owner sAMAccountName>'
    mitre: []

  - id: AD-SVC-UNUSED
    name: Unused service account
    category: Service
    weight: 0.30
    level_hint: Medium
    applies_to: [serviceAccount]
    title: Unused service account ({days_inactive} days)
    description: >-
      lastLogonTimestamp shows no authentication for {days_inactive} days. Orphaned service
      accounts keep their rights and passwords long after the service is gone.
    recommendation: Confirm with the owner, disable, and delete after the retention period.
    remediation_command: Disable-ADAccount -Identity '{sam}'
    mitre: [T1078.002]
