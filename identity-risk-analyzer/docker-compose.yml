# One-command demo: `docker compose up --build` -> http://localhost:8080 (UI) and :8000/docs (API).
# Works offline in mock mode. For live mode, put LDAP_* settings in .env (see .env.example).
services:
  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////data/risk_radar.db
      CORS_ORIGINS: '["http://localhost:8080"]'
    volumes:
      - ira-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  ira-data:
