<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/radar.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Identity Risk Analyzer — Active Directory security radar" />
    <title>Identity Risk Radar</title>
    <script>
      // Apply the saved theme/language before the first paint (no flash). Defaults: dark theme, Russian.
      (function () {
        var d = document.documentElement;
        try {
          if (localStorage.getItem("ira.theme") === "light") d.classList.remove("dark");
          var l = localStorage.getItem("ira.lang");
          if (l === "ru" || l === "kk" || l === "en") d.lang = l;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
